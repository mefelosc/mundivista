<!doctype html>
<html lang="pt-BR">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="robots" content="noindex" />
		<title>%sveltekit.status% — Mundivista</title>
		<style>
			:root {
				color-scheme: light dark;
				--paper: #eef3ee;
				--ink: #22322a;
				--muted: #5c6f62;
				--line: rgba(34, 50, 42, 0.18);
				--accent: #4d7359;
			}
			@media (prefers-color-scheme: dark) {
				:root {
					--paper: #0f1411;
					--ink: #edf3ee;
					--muted: #a8b8ad;
					--line: rgba(237, 243, 238, 0.2);
					--accent: #95cfae;
				}
			}
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				min-height: 100dvh;
				display: grid;
				place-items: center;
				padding: 1.5rem;
				background:
					radial-gradient(110% 80% at 50% 0%, color-mix(in oklab, var(--accent) 10%, transparent), transparent 60%),
					var(--paper);
				color: var(--ink);
				font-family: 'Instrument Sans', ui-sans-serif, system-ui, sans-serif;
			}
			main {
				width: min(34rem, 100%);
				padding: clamp(1.4rem, 4vw, 2.2rem);
				border: 1px solid var(--line);
				border-top: 3px solid var(--accent);
				border-radius: 0.25rem;
				background: color-mix(in oklab, var(--paper) 86%, var(--ink) 4%);
			}
			span {
				font-family: 'IBM Plex Mono', ui-monospace, monospace;
				font-size: 0.68rem;
				letter-spacing: 0.12em;
				text-transform: uppercase;
				color: var(--muted);
			}
			h1 {
				margin: 0.5rem 0 0.6rem;
				font-family: 'Newsreader', Georgia, serif;
				font-size: clamp(2.2rem, 6vw, 3.4rem);
				font-weight: 600;
				line-height: 0.98;
				letter-spacing: -0.035em;
			}
			p {
				margin: 0;
				font-size: 0.95rem;
				line-height: 1.55;
				color: var(--muted);
			}
			nav {
				display: flex;
				gap: 0.5rem;
				flex-wrap: wrap;
				margin-top: 1.2rem;
			}
			a {
				border: 1px solid var(--line);
				border-radius: 0.2rem;
				padding: 0.5rem 0.7rem;
				color: var(--ink);
				text-decoration: none;
				font-size: 0.8rem;
			}
			a:first-child {
				border-color: var(--accent);
				color: var(--accent);
			}
		</style>
	</head>
	<body>
		<main>
			<span>Erro %sveltekit.status%</span>
			<h1>Algo saiu do mapa</h1>
			<p>%sveltekit.error.message%</p>
			<nav>
				<a href="/explore">Abrir o atlas</a>
				<a href="/">Voltar ao início</a>
			</nav>
		</main>
	</body>
</html>
